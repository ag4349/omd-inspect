[project]
name = "omd-inspect"
version = "0.1.0"
description = "Inspect OpenMM state files from the command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
omd-inspect = "omd_inspect.cli:main"

[project.optional-dependencies]
verify = ["openmm"]
dev = [
    "pytest",
    "ruff",
    "openmm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omd_inspect"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
