[project]
name = "omd-inspect"
version = "0.1.0"
description = "Inspect OpenMM checkpoint state files and trajectory segments from the command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openmm",
    "mdtraj",
]

[project.scripts]
omd-inspect = "omd_inspect.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omd_inspect"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
