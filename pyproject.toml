[project]
name = "omd-inspect"
dynamic = ["version"]
description = "Inspect OpenMM state files from the command line"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Akshat Gautam", email = "ag4349@columbia.edu" },
]
requires-python = ">=3.10"
dependencies = []
keywords = ["openmm", "molecular-dynamics", "simulation", "cli", "xml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ag4349/omd-inspect"
Repository = "https://github.com/ag4349/omd-inspect"
Issues = "https://github.com/ag4349/omd-inspect/issues"

[project.scripts]
omd-inspect = "omd_inspect.cli:main"

[project.optional-dependencies]
verify = ["openmm"]
dev = [
    "pytest",
    "ruff",
    "openmm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/omd_inspect/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/omd_inspect"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
